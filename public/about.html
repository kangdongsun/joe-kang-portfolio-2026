      /* ---------- content (mirrors src/components/AboutPage.tsx) ---------- */

      /* ---------- experience (mirrors src/components/AboutPage.tsx) ---------- */

      function Experience() {
        return (
          <section className="w-full bg-[#f0dfd0]">
            <div className="mx-auto flex max-w-[1028px] flex-col gap-10 px-6 py-20 md:px-8">

      const N = sections.length;
      const FILL = 0.62;
      const BASE = [164, 164, 164];
      const INK = [62, 62, 62];
      const PERSIMMON = [244, 93, 72];

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const mix = (a, b, t) =>
        `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)}, ${Math.round(a[1] + (b[1] - a[1]) * t)}, ${Math.round(a[2] + (b[2] - a[2]) * t)})`;
      const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      const PERSPECTIVE = 1600;

      function wordsOf(section) {
        const out = [];
        section.paragraphs.forEach((runs, p) => {
          for (const run of runs) {
            for (const w of run.text.split(/\s+/).filter(Boolean)) {
              out.push({ text: w, accent: !!run.accent, paragraph: p });
            }
          }
        });
        return out;
      }
      const sectionWords = sections.map(wordsOf);

      function Copy({ index, filled = false, innerRef }) {
        const words = sectionWords[index];
        let cursor = 0;
        return (
          <div ref={innerRef} data-copy={index}
               className="flex flex-col gap-[20px] font-sans text-[14px] font-bold uppercase leading-[20px] tracking-[1.4px] md:text-eyebrow-md lg:gap-8 lg:text-eyebrow-lg">
            {sections[index].paragraphs.map((_, p) => {
              const inParagraph = words.filter((w) => w.paragraph === p);
              return (
                <p key={p}>
                  {inParagraph.map((w, j) => {
                    const i = cursor++;
                    return (
                      <span key={j} data-word={i} data-accent={w.accent ? '' : undefined}
                            style={{ color: mix(BASE, w.accent ? PERSIMMON : INK, filled ? 1 : 0) }}>
                        {w.text}{j < inParagraph.length - 1 ? ' ' : ''}
                      </span>
                    );
                  })}
                </p>
              );
            })}
          </div>
        );
      }

      function CardFace({ children }) {
        return (

            {children}

        );
      }
      const AboutVideo = ({ src, label }) => (

      function AboutPage() {
        const trackRef = useRef(null);
        const stageRef = useRef(null);
        const cardRef = useRef(null);
        const copyRefs = useRef([]);
        const faceARef = useRef(null);
        const faceBRef = useRef(null);
        const [reduced] = useState(() => window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        useEffect(() => {
          if (reduced) return;
          const track = trackRef.current, stage = stageRef.current, card = cardRef.current;
          if (!track || !stage || !card) return;
          const desktop = window.matchMedia('(min-width: 1024px)');
          let raf = 0, travel = 0;
          const measure = () => { travel = Math.max(0, stage.clientWidth - card.offsetWidth); };
          const spans = copyRefs.current.map((el) => el ? Array.from(el.querySelectorAll('span[data-word]')) : []);

          const update = () => {
            raf = 0;
            const isDesktop = desktop.matches;
            const total = track.offsetHeight - window.innerHeight;
            const p = total > 0 ? clamp(-track.getBoundingClientRect().top / total, 0, 1) : 0;
            const slot = Math.min(p * N, N - 1e-4);
            const s = Math.floor(slot);
            const local = slot - s;
            const revealed = clamp(local / FILL, 0, 1);
            const flip = s < N - 1 ? clamp((local - FILL) / (1 - FILL), 0, 1) : 0;

            for (let i = 0; i < N; i++) {
              const amount = i < s ? 1 : i === s ? revealed : 0;
              const list = spans[i];
              for (let j = 0; j < list.length; j++) {
                const t = clamp(amount * list.length - j, 0, 1);
                const accent = list[j].dataset.accent !== undefined;
                list[j].style.color = mix(BASE, accent ? PERSIMMON : INK, t);
              }
              const el = copyRefs.current[i];
              if (el) {
                const opacity = i === s ? 1 - clamp(flip / 0.45, 0, 1)
                  : i === s + 1 ? clamp((flip - 0.55) / 0.45, 0, 1) : 0;
                el.style.opacity = String(opacity);
                el.style.visibility = opacity < 0.01 ? 'hidden' : 'visible';
              }
            }

            const rot = (s + flip) * 180;
            const from = s % 2 === 0 ? travel : 0;
            const to = (s + 1) % 2 === 0 ? travel : 0;
            const x = isDesktop ? from + (to - from) * easeInOut(flip) : 0;
            // Vanishing point tracks the card — see AboutPage.tsx.
            stage.style.perspectiveOrigin = isDesktop
              ? `${(x + card.offsetWidth / 2).toFixed(1)}px 50%`
              : '50% 50%';
            card.style.transform = isDesktop
              ? `translateX(${x.toFixed(1)}px) rotateY(${rot.toFixed(2)}deg)`
              : `translateX(-50%) rotateY(${rot.toFixed(2)}deg)`;

            const half = Math.floor(rot / 180);
            const aIdx = clamp(half % 2 === 0 ? half : half + 1, 0, N - 1);
            const bIdx = clamp(half % 2 === 0 ? half + 1 : half, 0, N - 1);
            [[faceARef.current, aIdx], [faceBRef.current, bIdx]].forEach(([face, want]) => {
              if (!face) return;
              face.querySelectorAll('video').forEach((v) => {
                v.style.opacity = Number(v.dataset.index) === want ? '1' : '0';
              });
            });
          };

          const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
          const onResize = () => { measure(); onScroll(); };
          measure(); update();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onResize);
          desktop.addEventListener('change', onResize);
          const ro = new ResizeObserver(onResize);
          ro.observe(stage);
          return () => {
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onResize);
            desktop.removeEventListener('change', onResize);
            ro.disconnect();
            if (raf) cancelAnimationFrame(raf);
          };
        }, [reduced]);

        if (reduced) {
          return (
            <div className="relative min-h-screen bg-canvas">
              <Header />
              <main>
                <section className="w-full bg-canvas">
                  <div className="mx-auto flex max-w-[1028px] flex-col gap-20 px-6 py-32 md:px-8">
                    {sections.map((sec, i) => (
                      <div key={i} className={['flex flex-col gap-10 lg:items-center lg:gap-[60px]',
                        i % 2 === 0 ? 'lg:flex-row' : 'lg:flex-row-reverse'].join(' ')}>
                        <div className="lg:w-[500px] lg:shrink-0"><Copy index={i} filled /></div>
                        <div className="relative aspect-[468/735] w-full overflow-hidden rounded-2xl lg:w-[468px] lg:shrink-0">
                          <AboutVideo src={sec.video} label={sec.label} />
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
                <Experience />
              </main>
              <Footer />
            </div>
          );
        }

        return (
          <div className="relative min-h-screen bg-canvas">
            <Header />
            <main>
              {/* Below lg the pin is dropped — sections stack per the mobile frame. */}
              <section className="w-full bg-canvas lg:hidden">
                <div className="mx-auto flex max-w-[1028px] flex-col gap-20 px-6 py-28 md:px-8">
                  {sections.map((sec, i) => (
                    <div key={i} className="flex flex-col gap-10">
                      <Copy index={i} filled />
                      <div className="relative aspect-[468/735] w-full max-w-[420px] self-center overflow-hidden rounded-2xl">
                        <AboutVideo src={sec.video} label={sec.label} />
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Desktop: one section at a time, pinned, card flips between them. */}
              {/* No overflow-hidden — it would make this a scroll container and
                  silently break the sticky pin below. */}
              <section ref={trackRef} className="relative hidden w-full bg-canvas lg:block lg:h-[520vh]">
                <div className="sticky top-0 flex h-screen items-center px-6 md:px-8">
                  <div ref={stageRef} className="relative mx-auto h-[min(735px,calc(100vh-200px))] w-full max-w-[1028px]"
                       style={{ perspective: `${PERSPECTIVE}px` }}>
                    {sections.map((_, i) => (
                      <div key={i} ref={(el) => { copyRefs.current[i] = el; }}
                           className={['absolute top-1/2 w-[48.64%] -translate-y-1/2', i % 2 === 0 ? 'left-0' : 'left-[51.36%]'].join(' ')}
                           style={{ opacity: i === 0 ? 1 : 0, visibility: i === 0 ? 'visible' : 'hidden' }}>
                        <Copy index={i} />
                      </div>
                    ))}
                    <div ref={cardRef} className="absolute left-0 top-0 aspect-[468/735] h-full [transform-style:preserve-3d]">
                      <div ref={faceARef} className="absolute inset-0 [backface-visibility:hidden]">
                        <CardFace>
                          {sections.map((sec, i) => i % 2 === 0 ? (
                            <video key={i} data-index={i} src={sec.video} autoPlay muted loop playsInline aria-label={sec.label}
                                   className="absolute inset-0 h-full w-full object-cover" style={{ opacity: i === 0 ? 1 : 0 }} />
                          ) : null)}
                        </CardFace>
                      </div>
                      <div ref={faceBRef} className="absolute inset-0 [backface-visibility:hidden] [transform:rotateY(180deg)]">
                        <CardFace>
                          {sections.map((sec, i) => i % 2 === 1 ? (
                            <video key={i} data-index={i} src={sec.video} autoPlay muted loop playsInline aria-label={sec.label}
                                   className="absolute inset-0 h-full w-full object-cover" style={{ opacity: 1 }} />
                          ) : null)}
                        </CardFace>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
              <Experience />
            </main>
            <Footer />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<AboutPage />);
    </script>
  </body>
</html>
