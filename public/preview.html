      /* ---------- scroll reveal ---------- */
      function useReveal() {
        const ref = useRef(null);
        const [shown, setShown] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { setShown(true); io.disconnect(); }
          }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return { ref, shown };
      }

      /* ---------- scroll blur: softens a section as it scrolls up out of
         view (the outgoing half of Hero -> Cards -> About). Writes
         filter/opacity straight to the DOM node inside a rAF, no re-render. */
      function useScrollBlur({ maxBlur = 14, exitPx = 480 } = {}) {
        const ref = useRef(null);
        useEffect(() => {
          const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduced) return;
          const el = ref.current;
          if (!el) return;
          // Desktop-only (matches this project's mobile/desktop split at `lg`)
          // — on mobile, sections scroll past too fast for this to read as
          // intentional, it just looks like flicker.
          const desktopQuery = window.matchMedia('(min-width: 1024px)');
          let raf = 0;
          const update = () => {
            raf = 0;
            if (!desktopQuery.matches) { el.style.filter = ''; el.style.opacity = ''; return; }
            const bottom = el.getBoundingClientRect().bottom;
            const progress = Math.min(1, Math.max(0, 1 - bottom / exitPx));
            el.style.filter = progress > 0.01 ? `blur(${(progress * maxBlur).toFixed(1)}px)` : '';
            el.style.opacity = String(1 - progress * 0.35);
          };
          const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
          update();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onScroll);
          desktopQuery.addEventListener('change', update);
          const resizeObserver = new ResizeObserver(onScroll);
          resizeObserver.observe(el);
          return () => {
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onScroll);
            desktopQuery.removeEventListener('change', update);
            resizeObserver.disconnect();
            if (raf) cancelAnimationFrame(raf);
          };
        }, [maxBlur, exitPx]);
        return ref;
      }

      /* ---------- letter hover: mouse-proximity distortion for Hero copy —
         letters near the cursor scale up, falling off with distance.
         Decorative only: skipped under prefers-reduced-motion, gated to
         hover-capable fine pointers. Writes to [data-letter] nodes in a rAF. */
      function useHoverLetters() {
        const ref = useRef(null);
        useEffect(() => {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
          const el = ref.current;
          if (!el) return;
          const RADIUS = 70, MAX_SCALE = 0.26;
          let raf = 0, pointer = null;
          const apply = () => {
            raf = 0;
            el.querySelectorAll('[data-letter]').forEach((letter) => {
              if (!pointer) { letter.style.transform = ''; return; }
              const r = letter.getBoundingClientRect();
              const dx = pointer.x - (r.left + r.width / 2);
              const dy = pointer.y - (r.top + r.height / 2);
              const t = Math.max(0, 1 - Math.hypot(dx, dy) / RADIUS);
              const eased = t * t;
              if (eased < 0.005) { letter.style.transform = ''; }
              else {
                letter.style.transform = `scale(${(1 + eased * MAX_SCALE).toFixed(3)})`;
              }
            });
          };
          const onMove = (e) => {
            if (e.pointerType !== 'mouse') return;
            pointer = { x: e.clientX, y: e.clientY };
            if (!raf) raf = requestAnimationFrame(apply);
          };
          const onLeave = () => { pointer = null; if (!raf) raf = requestAnimationFrame(apply); };
          el.addEventListener('pointermove', onMove);
          el.addEventListener('pointerleave', onLeave);
          return () => {
            el.removeEventListener('pointermove', onMove);
            el.removeEventListener('pointerleave', onLeave);
            if (raf) cancelAnimationFrame(raf);
          };
        }, []);
        return ref;
      }

      /* Combines two refs onto one DOM node (Hero needs both scroll-blur and
         hover-letters on its outer <section>). */
      function mergeRefs(...refs) {
        return (node) => {
          for (const ref of refs) {
            if (!ref) continue;
            if (typeof ref === 'function') ref(node);
            else ref.current = node;
          }
        };
      }

      /* ---------- Words: the site's one word-by-word text reveal (Hero,
         section header, case-study cards). `runs` lets a highlighted/serif
         phrase continue the same stagger sequence as plain text. `active`
         gates playback for scroll-triggered callers (false = invisible, no
         animation, until useReveal flips it true). ---------- */
      function tokenizeRuns(runs) {
        const tokens = [];
        for (const run of runs) {
          for (const word of run.text.split(/\s+/).filter(Boolean)) {
            tokens.push({ text: word, className: run.className });
          }
        }
        return tokens;
      }
      function Words({ text, runs, start = 0, step = 55, active = true, className, hoverLetters = false }) {
        const tokens = tokenizeRuns(runs || (text ? [{ text }] : []));
        // Outside the Hero, copy reveals a block at a time rather than word by
        // word — only `hoverLetters` (Hero-only) keeps the per-word stagger.
        if (!hoverLetters) {
          return (
            <span
              className={['inline-block align-top', active ? 'animate-word-reveal' : 'opacity-0', className].filter(Boolean).join(' ')}
              style={active ? { animationDelay: start + 'ms' } : undefined}
            >
              {tokens.map((token, i) => (
                <span key={i} className={token.className}>
                  {token.text}{i < tokens.length - 1 ? ' ' : ''}
                </span>
              ))}
            </span>
          );
        }
        return tokens.map((token, i) => (
          <span key={i}>
            <span
              className={['inline-block', active ? 'animate-word-reveal' : 'opacity-0', className, token.className].filter(Boolean).join(' ')}
              style={active ? { animationDelay: (start + i * step) + 'ms' } : undefined}
            >
              {hoverLetters
                ? Array.from(token.text).map((ch, ci) => <span key={ci} data-letter className="inline-block">{ch}</span>)
                : token.text}
            </span>
            {i < tokens.length - 1 ? ' ' : ''}
          </span>
        ));
      }

      /* ---------- Hero ---------- */
      function Hero({ ready }) {
        const blurRef = useScrollBlur({ exitPx: 560 });
        const hoverRef = useHoverLetters();
        const desktopVideoRef = useRef(null);
        const mobileVideoRef = useRef(null);

        // Videos start paused; only play once the preloader curtain lifts.
        useEffect(() => {
          if (!ready) return;
          desktopVideoRef.current && desktopVideoRef.current.play().catch(() => {});
          mobileVideoRef.current && mobileVideoRef.current.play().catch(() => {});
        }, [ready]);

        // Play once, hold on the last frame for 3s, then replay (instead of loop).

              <div className="relative h-[810px] w-full">
                <div className="absolute left-[calc(50%-373px)] top-1/2 flex w-[406px] -translate-x-1/2 -translate-y-1/2 flex-col items-end">
                  <h1 className="whitespace-nowrap font-sans text-hero font-bold tracking-[-3.84px] text-ink"><Words text="Joe Kang" start={150} active={ready} hoverLetters /></h1>
                  <p className="text-right font-sans text-h5 font-semibold leading-[32px] text-ink"><Words text="Senior Product Designer" start={270} active={ready} hoverLetters /></p>
                  <div className="flex items-center justify-end gap-1">
                    {/* Literal 📍 per Figma, kept outside <Words> — see Hero.tsx */}
                    <span aria-hidden="true" className="shrink-0 text-h5 leading-[32px]">📍</span>
                    <p className="text-right font-sans text-h5 font-semibold leading-[32px] text-ink"><Words text="SF Bay Area" start={450} active={ready} hoverLetters /></p>
                  </div>
                </div>
                {/* Bold italic tagline; top aligned with "Senior Product Designer"'s
                    top (50%+24px); forced to exactly 2 lines via <br/> + nowrap. */}
                <p className="absolute left-[calc(50%+205px)] top-[calc(50%+24px)] w-[294px] whitespace-nowrap text-left font-sans text-[24px] italic leading-[32px] text-ink">
                  <Words text="Driving growth and building" start={780} active={ready} hoverLetters />
                  <br />
                  <Words start={1000} active={ready} hoverLetters runs={[
                    { text: 'trust through' },
                    { text: 'mindful design.', className: 'text-accent-persimmon' },
                  ]} />
                </p>
              </div>
            </div>

            {/* Desktop bottom blend — full-width over video AND tan side-panels */}
            <div aria-hidden="true" className="pointer-events-none absolute inset-x-0 bottom-0 hidden h-[13%] bg-[linear-gradient(to_bottom,rgba(248,237,224,0),#f8ede0_65%)] lg:block" />

            {/* ===== Mobile / tablet (<lg) ===== */}
            <div className="lg:hidden">
              <div className="relative aspect-[390/643] w-full overflow-hidden">
                <video ref={mobileVideoRef} className="absolute inset-0 h-full w-full object-cover object-center" src="/assets/hero-video.mp4" muted loop playsInline aria-hidden="true" />
                <div aria-hidden="true" className="pointer-events-none absolute inset-x-0 bottom-0 h-[24%] bg-[linear-gradient(to_bottom,rgba(248,237,224,0),#f8ede0_78%)]" />
              </div>
              <div className="flex flex-col items-center px-3 pb-14 -mt-5 text-center">
                <h1 className="whitespace-nowrap font-sans text-hero font-bold tracking-[-3.84px] text-ink"><Words text="Joe Kang" start={120} step={55} active={ready} hoverLetters /></h1>
                <p className="mt-1 font-sans text-[20px] font-bold leading-[28px] text-ink"><Words text="Senior Product Designer" start={230} step={55} active={ready} hoverLetters /></p>
                <div className="flex items-center justify-center gap-1">
                  <span aria-hidden="true" className="shrink-0 text-[20px] leading-[28px]">📍</span>
                  <p className="font-sans text-[20px] font-bold leading-[28px] text-ink"><Words text="SF Bay Area" start={395} step={55} active={ready} hoverLetters /></p>
                </div>
              </div>
            </div>
          </section>
        );
      }

      /* ---------- ProjectCard ---------- */
      // Text (eyebrow/title/description) uses the shared Words reveal, same as

      function ProjectCard({ project }) {

        }));

          <article ref={ref}
            className={['group relative w-full max-w-content rounded-md bg-canvas p-0 lg:rounded-card lg:p-2',
              'transition-colors duration-300 ease-[var(--ease-out)]',
              hoverTintByAccent[project.accent]].join(' ')}>
            {project.href && <a href={project.href} aria-label={project.title + ' — case study'} className="absolute inset-0 z-20" />}
            <div className="flex flex-col gap-3 lg:h-[574px] lg:flex-row lg:items-center lg:gap-20 lg:px-8">

                    className="pointer-events-none absolute bottom-0 left-1/2 z-0 w-[96%] -translate-x-1/2 translate-y-[34%] opacity-60 transition-transform duration-300 ease-[var(--ease-out)] lg:group-hover:scale-[0.88]" />
                  <img src={project.image} alt={project.imageAlt} loading="lazy"
                    className="relative z-10 block w-full object-contain transition-transform duration-300 ease-[var(--ease-out)] lg:group-hover:-translate-y-2.5" />

              <div className="flex w-full flex-col gap-2 px-1 pb-5 pr-8 text-body lg:flex-1 lg:gap-3 lg:px-0 lg:pb-0">
                <div className="flex flex-col gap-1">
                  <p className="font-sans text-eyebrow-sm font-bold uppercase text-body lg:text-eyebrow-md"><Words text={project.eyebrow} active={shown} /></p>
                  <h3 className="font-sans text-[20px] font-bold leading-[28px] text-body md:text-[28px] md:leading-[36px] lg:text-h4"><Words text={project.title} start={110} active={shown} /></h3>

      /* ---------- SelectedProjects ---------- */
      function SelectedProjects() {

                <p className="font-sans text-eyebrow-sm font-bold uppercase text-body lg:text-eyebrow-md"><Words text="Couple of my" active={shown} /></p>
                <h2 className="font-sans text-[24px] font-bold leading-[32px] text-ink md:text-[36px] md:leading-[44px] lg:text-h3"><Words text="Selected Projects" start={90} active={shown} /></h2>
              </div>
              <div className="mt-10 flex flex-col gap-10 lg:mt-2.5 lg:gap-2.5">
                {projects.map((p) => <ProjectCard key={p.id} project={p} />)}

      /* ---------- ComingSoon ("More Projects — Coming Soon!" banner) ----------
         Replaces the old scroll-pinned About bio block — that content now
         lives on its own page (about.html); Home's bottom is just this short
         teaser between Selected Projects and the Footer. */
      function ComingSoon() {
        const { ref, shown } = useReveal();
        // #f0dfd0 (not Figma's #efe1d2) so this runs seamlessly into the
        // Footer — see ComingSoon.tsx.
        return (
          <section className="w-full bg-[#f0dfd0] px-6 py-20 md:px-8 lg:pb-20 lg:pt-40">
            <div ref={ref} className="mx-auto flex max-w-content flex-col items-center gap-1 text-center">
              <p className="font-sans text-eyebrow-sm font-bold uppercase text-body lg:text-eyebrow-md"><Words text="More Projects" active={shown} /></p>
              <h2 className="font-sans text-[24px] font-bold leading-[32px] text-ink md:text-[36px] md:leading-[44px] lg:text-h3"><Words text="Coming Soon!" start={90} active={shown} /></h2>
            </div>
          </section>
        );

      /* ---------- Footer ---------- */
      function Footer() {
        return (
          <footer className="w-full bg-[#f0dfd0] px-8 py-8">
            <div className="mx-auto flex max-w-content items-center justify-center">
              <p className="font-sans text-body-4 font-normal text-body">2026 Joe Kang. All Rights Reserved</p>
            </div>
          </footer>
        );
      }

      /* ---------- Preloader (mirrors src/components/Preloader.tsx) ---------- */
      const LIFT_MS = 650;
      // Letter choreography — the name starts before the mark has settled.
      const LOGO_MS = 620, LETTER_START_MS = 120, LETTER_STAGGER_MS = 70, LETTER_MS = 520;
      const WORDMARK = 'Joe Kang';
      // The curtain waits for exactly the reveal, derived from the constants above.
      const REVEAL_DONE_MS = LETTER_START_MS + (WORDMARK.length - 1) * LETTER_STAGGER_MS + LETTER_MS;
      const HOLD_AT_FULL_MS = 220;
      // Whole lockup creeps upward the entire time it's on screen — linear, so
      // it reads as continuous motion rather than settling.
      const DRIFT_MS = REVEAL_DONE_MS + HOLD_AT_FULL_MS + LIFT_MS;
      const DRIFT_FROM_PX = 14, DRIFT_TO_PX = -18;
      function Preloader({ onLiftStart, onDone }) {
        const [mounted, setMounted] = useState(false);
        const [ready, setReady] = useState(false);
        const [lifting, setLifting] = useState(false);

        useEffect(() => {
          const raf = requestAnimationFrame(() => setMounted(true));
          // rAF is paused in background tabs — timer is the backstop.
          const t = window.setTimeout(() => setMounted(true), 60);
          return () => { cancelAnimationFrame(raf); window.clearTimeout(t); };
        }, []);

        // Lift only once the page has loaded AND the minimum has elapsed.
        useEffect(() => {
          let loaded = document.readyState === 'complete';
          let revealed = false;
          const check = () => { if (loaded && revealed) setReady(true); };
          const onLoad = () => { loaded = true; check(); };
          if (!loaded) window.addEventListener('load', onLoad);
          const timer = window.setTimeout(() => { revealed = true; check(); }, REVEAL_DONE_MS);
          return () => { window.clearTimeout(timer); window.removeEventListener('load', onLoad); };
        }, []);

        useEffect(() => {
          if (!ready) return;
          const t = window.setTimeout(() => { setLifting(true); onLiftStart(); }, HOLD_AT_FULL_MS);
          return () => clearTimeout(t);
        }, [ready]);

        // onDone unmounts the overlay AND restores body scroll — it must never
        // be skipped, or the page renders fine but refuses to scroll. See
        // Preloader.tsx: transitionend can't be the only trigger.
        const [done, setDone] = useState(false);
        const finish = () => { if (done) return; setDone(true); onDone(); };
        useEffect(() => {
          if (!lifting) return;
          const t = window.setTimeout(finish, LIFT_MS + 150);
          return () => clearTimeout(t);
        }, [lifting]);

        return (
          <div className="fixed inset-0 z-50 flex flex-col items-center justify-center overflow-hidden bg-[#000000] transition-transform ease-[var(--ease-out)]"
            style={{ transitionDuration: LIFT_MS + 'ms', transform: lifting ? 'translateY(-100%)' : 'translateY(0)' }}
            onTransitionEnd={(e) => { if (e.target !== e.currentTarget) return; if (e.propertyName === 'transform' && lifting) finish(); }}
            aria-hidden="true">
            {/* Continuous upward drift of the whole lockup. */}
            <div className="flex flex-col items-center gap-[9px] transition-transform ease-linear"
              style={{ transitionDuration: DRIFT_MS + 'ms',
                       transform: 'translateY(' + (mounted ? DRIFT_TO_PX : DRIFT_FROM_PX) + 'px)' }}>
              <div className="transition-[opacity,transform,filter] ease-[var(--ease-out)]"
                style={{ transitionDuration: LOGO_MS + 'ms', opacity: mounted ? 1 : 0,
                         transform: mounted ? 'translateY(0)' : 'translateY(28px)',
                         filter: mounted ? 'blur(0px)' : 'blur(10px)' }}>
                <Logo className="h-[100px] w-auto text-on-dark" />
              </div>
              {/* Per-letter rise — staggered transitions, no keyframe needed. */}
              <p className="flex font-sans text-h5 font-bold text-on-dark">
                {WORDMARK.split('').map((ch, i) => (
                  <span key={i}
                    className="inline-block whitespace-pre transition-[opacity,transform,filter] ease-[var(--ease-out)]"
                    style={{ transitionDuration: LETTER_MS + 'ms',
                             transitionDelay: (LETTER_START_MS + i * LETTER_STAGGER_MS) + 'ms',
                             opacity: mounted ? 1 : 0,
                             transform: mounted ? 'translateY(0)' : 'translateY(22px)',
                             filter: mounted ? 'blur(0px)' : 'blur(7px)' }}>
                    {ch === ' ' ? '\u00a0' : ch}
                  </span>
                ))}
              </p>
            </div>
          </div>
        );
      }

      /* ---------- App ---------- */
      // Curtain plays once per browser session — sessionStorage so a new
      // visit later still gets it, but reloads within the same session don't.
      const PRELOAD_SEEN_KEY = 'jk:preloaded';
      function hasPreloaded() {
        try { return sessionStorage.getItem(PRELOAD_SEEN_KEY) === '1'; } catch { return false; }
      }
      function App() {
        const [preloading, setPreloading] = useState(() => !hasPreloaded());
        const [ready, setReady] = useState(() => hasPreloaded());
        useEffect(() => {
          if (!preloading) return;
          const prev = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
          return () => { document.body.style.overflow = prev; };
        }, [preloading]);
        const finishPreload = () => {
          setPreloading(false);
          try { sessionStorage.setItem(PRELOAD_SEEN_KEY, '1'); } catch {}
        };
        return (
          <>
            {preloading && <Preloader onLiftStart={() => setReady(true)} onDone={finishPreload} />}
            <div className="relative min-h-screen bg-canvas">
              <Header />
              <main><Hero ready={ready} /><SelectedProjects /><ComingSoon /></main>
              <Footer />
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
