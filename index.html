<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joe Kang — Senior Product Designer</title>
    <meta
      name="description"
      content="Portfolio of Joe Kang, a product designer with 8+ years in monetization, ads, and growth. Driving growth through trust."
    />
    <!-- Cabin (display + body). The italic axis is required: the Hero tagline
         ("Driving growth and building trust through mindful design.") is set in
         Cabin Italic per Figma — without `ital` the browser fakes it by
         slanting the roman. Sedan was dropped; nothing uses font-serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- GoatCounter. `no_onload` because the app routes on the hash: count.js
         auto-counts once on load, which would record the landing page and miss
         every route after it. src/analytics.ts counts each route instead, the
         first one included. The `id` is what analytics.ts waits on to know the
         async script has landed. -->
    <script>
      window.goatcounter = { no_onload: true };
    </script>
    <script
      id="goatcounter"
      data-goatcounter="https://joekang.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
