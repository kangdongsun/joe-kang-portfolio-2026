      /* ---------- PlayableVideo (mirrors src/components/PlayableVideo.tsx) —
         never autoplays; click (or the center button) toggles play/pause;
         hover reveals play/pause + ±5s seek. ---------- */
      function PlayableVideo({ src, loop = false, className, ariaLabel }) {
        const videoRef = useRef(null);
        const [playing, setPlaying] = useState(false);
        const [hovering, setHovering] = useState(false);
        const toggle = () => {
          const v = videoRef.current; if (!v) return;
          if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause();
        };
        const seek = (delta) => {
          const v = videoRef.current; if (!v) return;
          const target = v.currentTime + delta;
          const duration = v.duration;
          if (loop && Number.isFinite(duration) && duration > 0) {
            v.currentTime = ((target % duration) + duration) % duration;
          } else {
            v.currentTime = Math.max(0, Number.isFinite(duration) ? Math.min(target, duration) : target);
          }
        };
        const controlsVisible = hovering || !playing;
        return (
          <div className={['relative overflow-hidden', className].filter(Boolean).join(' ')}
               onMouseEnter={() => setHovering(true)} onMouseLeave={() => setHovering(false)}>
            <video ref={videoRef} src={src} loop={loop} muted playsInline aria-label={ariaLabel}
                   onClick={toggle} onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
                   className="block w-full cursor-pointer" />
            <div className={['absolute inset-0 flex items-center justify-center gap-6 bg-[rgba(0,0,0,0.25)] transition-opacity duration-200',
                   controlsVisible ? 'opacity-100' : 'pointer-events-none opacity-0'].join(' ')}>
              <button type="button" onClick={() => seek(-5)} aria-label="Back 5 seconds"
                      className="flex size-9 items-center justify-center rounded-full bg-surface-card text-ink transition-transform duration-150 hover:scale-105">
                <SeekBackIcon className="size-5" />
              </button>
              <button type="button" onClick={toggle} aria-label={playing ? 'Pause video' : 'Play video'}
                      className="flex size-14 items-center justify-center rounded-full bg-surface-card text-ink transition-transform duration-150 hover:scale-105">
                {playing ? <PauseIcon className="size-6" /> : <PlayIcon className="size-6 translate-x-[1px]" />}
              </button>
              <button type="button" onClick={() => seek(5)} aria-label="Forward 5 seconds"
                      className="flex size-9 items-center justify-center rounded-full bg-surface-card text-ink transition-transform duration-150 hover:scale-105">
                <SeekForwardIcon className="size-5" />
              </button>
            </div>
          </div>
        );
      }

      /* ---------- scroll reveal ---------- */
      function useReveal() {
        const ref = useRef(null);
        const [shown, setShown] = useState(false);
        useEffect(() => {
          const el = ref.current; if (!el) return;
          const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } },
            { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return { ref, shown };
      }

      /* ---------- scroll blur (mirrors src/components/useScrollBlur.ts) ---------- */
      function useScrollBlur(opts) {
        const maxBlur = (opts && opts.maxBlur) || 14;
        const exitPx = (opts && opts.exitPx) || 480;
        const ref = useRef(null);
        useEffect(() => {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          const el = ref.current; if (!el) return;
          // Desktop-only (matches this project's mobile/desktop split at `lg`)
          // — on mobile, sections scroll past too fast for this to read as
          // intentional, it just looks like flicker.
          const desktopQuery = window.matchMedia('(min-width: 1024px)');
          let raf = 0;
          const update = () => {
            raf = 0;
            if (!desktopQuery.matches) { el.style.filter = ''; el.style.opacity = ''; return; }
            const bottom = el.getBoundingClientRect().bottom;
            const progress = Math.min(1, Math.max(0, 1 - bottom / exitPx));
            el.style.filter = progress > 0.01 ? `blur(${(progress * maxBlur).toFixed(1)}px)` : '';
            el.style.opacity = String(1 - progress * 0.35);
          };
          const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
          update();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onScroll);
          desktopQuery.addEventListener('change', update);
          const resizeObserver = new ResizeObserver(onScroll);
          resizeObserver.observe(el);
          return () => {
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('resize', onScroll);
            desktopQuery.removeEventListener('change', update);
            resizeObserver.disconnect();
            if (raf) cancelAnimationFrame(raf);
          };
        }, [maxBlur, exitPx]);
        return ref;
      }

      /* ---------- Words (mirrors src/components/Words.tsx) ---------- */
      function tokenize(runs) {
        const tokens = [];
        for (const run of runs) {
          for (const word of run.text.split(/\s+/).filter(Boolean)) {
            tokens.push({ text: word, className: run.className });
          }
        }
        return tokens;
      }
      function createCascade(startAt, defaults) {
        startAt = startAt || 0; defaults = defaults || {};
        let cursor = startAt;
        return {
          next(text, overrides) {
            overrides = overrides || {};
            const step = overrides.step ?? defaults.step ?? 55;
            const gap = overrides.gap ?? defaults.gap ?? 120;
            const words = typeof text === 'number' ? text : text.split(/\s+/).filter(Boolean).length;
            const start = cursor;
            cursor = start + words * step + gap;
            return start;
          },
          peek() { return cursor; },
        };
      }
      // Block-level reveal: the whole heading / paragraph / label animates as
      // one unit (see Words.tsx). Only the Hero still staggers per word, and
      // the Hero lives in preview.html — so this copy never does.
      function Words({ text, runs, start = 0, step = 55, active = true, className, block = false }) {
        const tokens = tokenize(runs ?? (text ? [{ text }] : []));
        return (
          <span
            className={[block ? 'block' : 'inline-block align-top', active ? 'animate-word-reveal' : 'opacity-0', className].filter(Boolean).join(' ')}
            style={active ? { animationDelay: `${start}ms` } : undefined}
          >
            {tokens.map((token, i) => (
              <span key={i} className={token.className}>
                {token.text}{i < tokens.length - 1 ? ' ' : ''}
              </span>
            ))}
          </span>
        );
      }

      /* ---------- NextProjectFloat (mirrors src/components/NextProjectFloat.tsx) ---------- */
      function NextProjectFloat({ nextHref }) {
        const [visible, setVisible] = useState(false);
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const fromBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
            setVisible(fromBottom < 1000);
          };
          const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
          update();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', onScroll);
          return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); if (raf) cancelAnimationFrame(raf); };
        }, []);
        return (
          <div className={['fixed bottom-5 right-5 z-40 flex flex-col gap-2 transition-all duration-500 ease-[var(--ease-out)] md:bottom-8 md:right-8',
            visible ? 'translate-y-0 opacity-100' : 'pointer-events-none translate-y-3 opacity-0'].join(' ')}>
            <a href={nextHref} className="flex items-center justify-center gap-1 rounded-sm bg-accent-persimmon px-4 py-3 font-sans text-eyebrow-sm font-bold uppercase text-surface-card transition-colors duration-200 hover:bg-[#af4233]">

              Back Home
              <HomeIcon className="size-4 text-ink" />
            </a>
          </div>
        );
      }
